name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build nyx-mcp binary (Apple Silicon)
        # Tauri externalBin requires a pre-built binary at
        # src-tauri/binaries/nyx-mcp-aarch64-apple-darwin.
        # Build it natively here so it is always current.
        run: |
          cargo build --release --bin nyx-mcp --target aarch64-apple-darwin --manifest-path src-tauri/Cargo.toml
          cp src-tauri/target/aarch64-apple-darwin/release/nyx-mcp src-tauri/binaries/nyx-mcp-aarch64-apple-darwin

      - name: Build Tauri app (Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Nyx v__VERSION__'
          releaseBody: |
            See the [changelog](https://github.com/NYX-privacy-ai/nyx/blob/main/CHANGELOG.md) for details.
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Upload stable-named DMG (website download link)
        # The website links to /releases/latest/download/Nyx_aarch64.dmg (no version
        # in the name) so the download URL never changes across releases.
        # When built with --target, Tauri outputs to target/<triple>/release/bundle/.
        run: |
          DMG=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Nyx_*_aarch64.dmg 2>/dev/null | head -1)
          [[ -z "$DMG" ]] && DMG=$(ls src-tauri/target/release/bundle/dmg/Nyx_*_aarch64.dmg 2>/dev/null | head -1)
          if [[ -n "$DMG" ]]; then
            cp "$DMG" Nyx_aarch64.dmg
            gh release upload "${{ github.ref_name }}" Nyx_aarch64.dmg --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-intel:
    needs: build-macos
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build nyx-mcp binary (Intel)
        # Tauri externalBin requires a pre-built binary at
        # src-tauri/binaries/nyx-mcp-x86_64-apple-darwin.
        # The committed binary is aarch64-only; build natively for Intel here.
        run: |
          cargo build --release --bin nyx-mcp --target x86_64-apple-darwin --manifest-path src-tauri/Cargo.toml
          cp src-tauri/target/x86_64-apple-darwin/release/nyx-mcp src-tauri/binaries/nyx-mcp-x86_64-apple-darwin

      - name: Build Tauri app (Intel)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Nyx v__VERSION__'
          releaseBody: |
            See the [changelog](https://github.com/NYX-privacy-ai/nyx/blob/main/CHANGELOG.md) for details.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-apple-darwin
